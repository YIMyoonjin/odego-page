<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODEGO · 약관 및 정책</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--orange:#FF5A1F;--ink:#17181C;--ink-2:#4A4E54;--ink-3:#8A9098;--line:#EDEEF0;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',sans-serif;background:#fafafa;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 28px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
  .logo{font-family:sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--orange)}
  .tag{color:var(--ink-3);font-size:14px;font-weight:600;margin-top:6px}
  h1{font-size:17px;font-weight:800;margin:26px 0 12px}
  a.link{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;margin-bottom:10px;transition:.12s}
  a.link:hover{border-color:var(--orange);background:#FFF6F2}
  a.link .arr{color:var(--ink-3)}
  .foot{margin-top:22px;color:var(--ink-3);font-size:12.5px;line-height:1.7}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ODEGO</div>
    <div class="tag">오늘의 라이딩, 새로운 인연과 · 조아조쿤(ZoaZokun.Studio)</div>
    <h1>약관 및 정책</h1>
    <a class="link" href="terms.html">이용약관 <span class="arr">›</span></a>
    <a class="link" href="privacy.html">개인정보 처리방침 <span class="arr">›</span></a>
    <div class="foot">문의: zoazokun.studio@gmail.com<br>시행일: 2026-09-18</div>
  </div>
</body>
</html>
